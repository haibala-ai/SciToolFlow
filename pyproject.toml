[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scitoolflow"
version = "0.3.0"
description = "SciToolFlow multi-tool benchmark with tasks, evaluation and a ReAct baseline"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "python-dotenv>=1", "jsonschema>=4.20"]

[project.scripts]
scitoolflow = "scitoolflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scitoolflow*", "baselines*", "evaluation*", "tools*"]
namespaces = false


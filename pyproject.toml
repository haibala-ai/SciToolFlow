[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scitoolflow"
version = "0.4.0"
description = "SciToolFlow scientific tool orchestration benchmark with executable tools, baselines and evidence-based evaluation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "httpx>=0.27", "python-dotenv>=1", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest", "pytest-subtests"]
plots = ["matplotlib>=3.9"]

[project.scripts]
scitoolflow = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks*", "src*", "baselines*", "evaluation*", "tools*", "scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".local", "resources", "results"]

